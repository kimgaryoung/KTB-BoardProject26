name: CI validation (no deployment)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew test --no-daemon
  frontend-and-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix frontend ci && npm --prefix frontend test
      - run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - run: bash -n scripts/ci/deploy.sh scripts/ci/deploy-remote.sh
      - name: Validate Actions syntax
        uses: docker://rhysd/actionlint:1.7.7
