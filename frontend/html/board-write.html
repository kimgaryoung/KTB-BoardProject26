<!doctype html>
<html lang="kr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/config.js"></script>
    <title>글쓰기 | 마크안에 사람이 살잖아</title>
    <link
            rel="stylesheet"
            href="../css/board-write.css"
            crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/community.css">
</head>
<body class="siteBoardPage">
<div class="wrap">
    <h2>게시글 작성</h2>
    <a id="communityLink" class="communityContext" href="/html/posts.html">← 마인크래프트 게시판으로</a>
    <div class="inputBox">
        <label>제목*</label>
        <input
                type="text"
                id="title" disabled
                placeholder="제목을 입력해 주세요. (최대 26자)"
        />
    </div>
    <div class="inputBox">
        <label>내용*</label>
        <textarea
                id="content" disabled
                placeholder="내용을 입력해 주세요."
        ></textarea>
        <p class="helperText" name="content"></p>
    </div>
    <div class="inputBox photoAttachment">
        <label for="image">사진 (선택)</label>
        <input type="file" id="image" accept="image/jpeg,image/png,image/gif,image/webp,image/bmp" disabled aria-describedby="photoHelp imageError">
        <p id="photoHelp" class="photoHelp">사진 1장 · 최대 5MB · 본문과 목록 썸네일에 표시됩니다.</p>
        <figure id="imagePreviewWrap" class="photoPreview" hidden>
            <img id="imagePreview" alt="첨부 사진 미리보기">
            <figcaption>
                <span id="imagePreviewText"></span>
                <button id="removeImage" type="button">사진 삭제</button>
            </figcaption>
        </figure>
        <p id="imageError" class="helperText" role="alert"></p>
    </div>
    <button id="submit" disabled>완료</button>
</div>
<div class="background"></div>
</body>
<script src="../js/board-write.js" type="module"></script>
</html>
