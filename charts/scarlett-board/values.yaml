namespace: scarlett-board

ingress:
  enabled: true
  className: alb

  host: board.scarlett-project.cloud

  scheme: internet-facing
  targetType: instance

  # Spring Boot context-path가 /v1이면 /v1로 통일
  backendPath: /v1

  listenPorts: '[{"HTTP":80},{"HTTPS":443}]'

  certificateArn: arn:aws:acm:ap-northeast-2:542896463069:certificate/7008f1a8-2402-4362-8858-dfe6740afe8b

  sslRedirect: ""

  # 우선 프론트엔드 / 경로로 상태 검사
  healthcheckPath: /
  successCodes: "200-399"


backend:
  replicaCount: 2

  image:
    repository: 542896463069.dkr.ecr.ap-northeast-2.amazonaws.com/scarlett-backend
    tag: "20260711-1307"
    pullPolicy: IfNotPresent

  containerPort: 3000

  strategy:
    maxSurge: 1
    maxUnavailable: 1

  config:
    AWS_REGION: ap-northeast-2
    AWS_S3_BUCKET: scarlett-ktb4-542896463069-ap-northeast-2-an
    AWS_S3_BASE_URL: https://scarlett-ktb4-542896463069-ap-northeast-2-an.s3.ap-northeast-2.amazonaws.com

  existingSecret: backend-secret

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 768Mi

  service:
    type: NodePort
    port: 80
    targetPort: 3000


frontend:
  replicaCount: 2

  image:
    repository: 542896463069.dkr.ecr.ap-northeast-2.amazonaws.com/scarlett-frontend
    tag: "20260715-084129"
    pullPolicy: IfNotPresent

  containerPort: 8080

  strategy:
    maxSurge: 1
    maxUnavailable: 0

  env:
    API_BASE_URL: /v1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

  service:
    type: NodePort
    port: 80
    targetPort: 8080


env: dev
terminationGracePeriodSeconds: 30
